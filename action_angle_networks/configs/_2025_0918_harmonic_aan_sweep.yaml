project: aan_harmonic_sweep
program: scripts/s2025_0918_aan_harmonic_motion.py
method: grid

parameters:
  # 固定値（必要なら CLI 側の既定を上書き）
  wandb-project: {value: "aan_harmonic_sweep"}
  experiment-name: {value: "aan_harmonic_sweep"}  
  n: {value: 2}
  delta-t: {value: 1.0}
  dim-hidden: {value: 100}
  num-gsblocks: {value: 20}
  activation: {value: "sigmoid"}
  dim-hidden-list: {value: [32, 32, 32]}
  num-steps: {value: 5000}
  test-time-jumps: {value: [1, 2, 5, 10, 20, 50]}
  normalize-qp: {value: False}
  batch-size: {value: 100}
  seed: {value: 42}
  log-every: {value: 100}
  save-every: {value: 500}
  
  # 探索パラメータ
  lr: 
    values: [1e-3, 5e-4, 1e-4]
  theta-predictor:
    values: ['gradient', 'mlp']
  mlp-res-connection:
    values: [True, False]
  alpha:
    values: [0.0, 0.1, 0.5, 1.0]
  learn-scale:
    values: [True, False]
  
command:
  - ${env}
  - python
  - ${program}
  - ${args}

# '{"num_heads": 6, "hw": [9, 9], "num_tf_blocks": 2, "pos_emb": "gta"}', etc